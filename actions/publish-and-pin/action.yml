name: publish-and-pin
description: >
  Build the repo's container image, push ghcr.io/kanatabi/<app>:sha-<short>
  (+ optional :main alias for test consumers), then open the vortex bump PR
  via bin/set-image-pr.sh. Raw docker + gh — deliberately no third-party
  actions: the only thing pinned here is anvil itself.
inputs:
  app:
    description: short image name (lumen|earendil|mellon) — also the vortex dir
    required: true
  context:
    description: docker build context
    default: "."
  tag:
    description: image tag to publish (normally sha-<short>)
    required: true
  version-arg:
    description: value passed to the Dockerfile ARG VERSION (Go builds stamp it)
    default: ""
  main-alias:
    description: also push :main (mutable — tests only, never deployments)
    default: "true"
  bump:
    description: open the vortex deploy-bump PR (requires vortex-bot-pat)
    default: "true"
  vortex-bot-pat:
    description: the VORTEX_BOT_PAT secret, passed through — never logged
    default: ""
runs:
  using: composite
  steps:
    - name: login to GHCR with the workflow token
      shell: bash
      run: |
        echo "${{ github.token }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
    - name: build
      shell: bash
      run: |
        ARGS=()
        [ -n "${{ inputs.version-arg }}" ] && ARGS+=(--build-arg VERSION="${{ inputs.version-arg }}")
        docker build "${ARGS[@]}" \
          -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ inputs.app }}:${{ inputs.tag }}" \
          "${{ inputs.context }}"
    - name: push
      shell: bash
      run: |
        docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ inputs.app }}:${{ inputs.tag }}"
        if [ "${{ inputs.main-alias }}" = "true" ]; then
          docker tag  "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ inputs.app }}:${{ inputs.tag }}" \
                      "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ inputs.app }}:main"
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ inputs.app }}:main"
        fi
    - name: bump vortex
      if: inputs.bump == 'true'
      shell: bash
      env:
        VORTEX_BOT_PAT: ${{ inputs.vortex-bot-pat }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../bin/set-image-pr.sh" \
          --app "${{ inputs.app }}" \
          --image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ inputs.app }}" \
          --tag "${{ inputs.tag }}"
