name: deploy-bump
description: >
  Open (or reuse) the vortex deploy-bump PR pinning an ALREADY-PUSHED image
  tag — bin/set-image-pr.sh is the only mechanism that moves a deployed
  version. The clone rides VORTEX_BOT_PAT because the push and the PR need it
  (vortex has been public since 2026-11-13 — the clone would work anonymous,
  the open step would not); the token is passed through env and never logged.
  Release-only doctrine: pass the vX.Y.Z tag, never an alias.
inputs:
  app:
    description: short image name (lumen|earendil|mellon) — also the vortex dir
    required: true
  tag:
    description: image tag to pin (MUST be vMAJOR.MINOR.PATCH for deployments)
    required: true
  vortex-bot-pat:
    description: the VORTEX_BOT_PAT secret, passed through — never logged
    default: ""
  config-epoch:
    description: >
      Optional non-negative integer. When the deployed config version moves,
      the bump PR may carry the epoch pair (omicron/config.epoch annotation +
      the gate's --declared arg) in lockstep: set it here and the PR flips
      BOTH sides plus the gate-image pins in one commit. Empty = image-only
      bump (lockstep still rides — the pair stays as-is).
    default: ""
runs:
  using: composite
  steps:
    - name: bump PR
      shell: bash
      env:
        VORTEX_BOT_PAT: ${{ inputs.vortex-bot-pat }}
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.tag }}
        CONFIG_EPOCH: ${{ inputs.config-epoch }}
      run: |
        ARGS=()
        [ -n "$CONFIG_EPOCH" ] && ARGS+=(--config-epoch "$CONFIG_EPOCH")
        bash "$GITHUB_ACTION_PATH/../../bin/set-image-pr.sh" \
          --app "$APP" \
          --image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${APP}" \
          --tag "$TAG" \
          "${ARGS[@]+"${ARGS[@]}"}"
