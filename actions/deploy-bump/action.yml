name: deploy-bump
description: >
  Open (or reuse) the vortex deploy-bump PR pinning an ALREADY-PUSHED image
  tag — bin/set-image-pr.sh is the only mechanism that moves a deployed
  version. The clone rides VORTEX_BOT_PAT because the push and the PR need it
  (vortex has been public since 2026-11-13 — the clone would work anonymous,
  the open step would not); the token is passed through env and never logged.
  Release-only doctrine: pass the vX.Y.Z tag, never an alias.
inputs:
  app:
    description: short image name (lumen|earendil|mellon) — also the vortex app dir
    required: true
  env:
    description: >
      Target environment: foundation|staging|production. Selects the vortex
      overlay the pin + epoch trio live in (environments/<env>/<app>/) and the
      bump branch grammar bump/<app>-<env>-<tag>.
    default: production
  tag:
    description: image tag to pin (MUST be vMAJOR.MINOR.PATCH for deployments)
    required: true
  vortex-bot-pat:
    description: the VORTEX_BOT_PAT secret, passed through — never logged
    default: ""
  config-epoch:
    description: >
      Optional non-negative integer. When the deployed config version moves,
      the bump PR may carry the epoch trio (pod-template omicron/config.epoch
      annotation + the gate's --declared arg + the ExternalSecret's
      omicron/config.epoch annotation) in lockstep: set it here and the PR
      flips ALL THREE sides plus the same-env image pins in one commit.
      Empty = image-only bump (lockstep still rides — the trio stays as-is).
    default: ""
runs:
  using: composite
  steps:
    - name: bump PR
      shell: bash
      env:
        VORTEX_BOT_PAT: ${{ inputs.vortex-bot-pat }}
        APP: ${{ inputs.app }}
        TAG: ${{ inputs.tag }}
        ENVIRONMENT: ${{ inputs.env }}
        CONFIG_EPOCH: ${{ inputs.config-epoch }}
      run: |
        ARGS=()
        [ -n "$CONFIG_EPOCH" ] && ARGS+=(--config-epoch "$CONFIG_EPOCH")
        bash "$GITHUB_ACTION_PATH/../../bin/set-image-pr.sh" \
          --app "$APP" \
          --env "$ENVIRONMENT" \
          --image "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${APP}" \
          --tag "$TAG" \
          "${ARGS[@]+"${ARGS[@]}"}"
